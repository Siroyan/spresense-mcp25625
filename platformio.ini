[platformio]
default_envs = spresense

[env]
platform = sonyspresense
board = spresense
framework = arduino
monitor_speed = 115200
lib_deps = autowp/autowp-mcp2515@1.3.1

; One board: internal loopback (no CAN peer required).
[env:spresense]
build_src_filter = -<*> +<main.cpp>
build_flags = -DCAN_LOOPBACK=1

; External CAN bus: 500 kbps, a second active node is required for ACK.
[env:spresense_can]
build_src_filter = -<*> +<main.cpp>
build_flags = -DCAN_LOOPBACK=0

; Host for the B-G431B-ESC1 motor board (SimpleFOC_B-G431): CAN 1 Mbps,
; sample point 75%, SPI 8 MHz (halved automatically if the self-test fails).
; Runs how_to_jump.md from the serial monitor -- see README.
[env:spresense_bg431]
build_src_filter = -<*> +<bg431_host.cpp> +<bg431_jump.cpp>
build_flags = -DBG431_SPI_HZ=8000000
