[platformio]
default_envs = spresense

[env]
platform = sonyspresense
board = spresense
framework = arduino
monitor_speed = 115200
lib_deps = autowp/autowp-mcp2515@1.3.1

; One board: internal loopback (no CAN peer required).
[env:spresense]
build_flags = -DCAN_LOOPBACK=1

; External CAN bus: 500 kbps, a second active node is required for ACK.
[env:spresense_can]
build_flags = -DCAN_LOOPBACK=0
